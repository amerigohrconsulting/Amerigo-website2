<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 120" width="220" height="120" role="img" aria-label="Amerigo HR Consulting logo">
  <title>Amerigo HR Consulting logo</title>
  <!--
    Simple vector logo composed of two letterforms: A (white) and C (gold).
    Font-family references Playfair Display for visual match; if that font
    isn't available where the SVG is rendered as an image, the shapes will
    still render as text but you can substitute with the original vector
    artwork later for exact pixel-perfect matching.
  -->
  <defs>
    <style type="text/css"><![CDATA[
      .logoA { font-family: 'Playfair Display', serif; font-weight:700; font-size:92px; }
      .logoC { font-family: 'Playfair Display', serif; font-weight:700; font-size:92px; }
    ]]></style>
  </defs>

  <!-- Positioning the A and C next to each other while preserving proportions -->
  <g transform="translate(6,4)">
    <text class="logoA" x="0" y="88" fill="#FFFFFF">A</text>
    <text class="logoC" x="72" y="88" fill="#C7A56A">C</text>
  </g>
</svg>
